<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KernelOS v2</title>
    <link rel="stylesheet" href="/styles-7edd1311ab4e6def.css" integrity="sha384-OjYY6xbF/12/u7qhWH3rkwe86t2wflQMsjfe58ye5VvT+Jl40k0W7KNM07MPwXmI"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        /* Prevent text selection during drag operations */
        .dragging {
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #4a9eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            margin-top: 20px;
            font-size: 1.2em;
            letter-spacing: 2px;
        }
        
        .loading-subtitle {
            color: rgba(255, 255, 255, 0.6);
            margin-top: 8px;
            font-size: 0.9em;
        }
    </style>
<link rel="modulepreload" href="/kernelosv2-55bd016442ab54a4.js" crossorigin="anonymous" integrity="sha384-Qyj7htMxL2sJ2bNMz/F7UfY2jsEg1LE2mqLc/lI9ojtZOTi7+jDdkYVWIjdg3z5X"><link rel="preload" href="/kernelosv2-55bd016442ab54a4_bg.wasm" crossorigin="anonymous" integrity="sha384-ire6/lWsXT42wp/YgghYhLFHhN3PZ22eZsBXgdEVr1Fb2BkBqSw4pqWwURE1C6Dh" as="fetch" type="application/wasm"></head>
<body>

        <div class="loader"></div>
        <div class="loading-text">KernelOS</div>
        <div class="loading-subtitle">Loading system components...</div>
    </div>

<script type="module">

    <script>
        // Hide loading screen once WASM is ready
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.classList.add('hidden');
                    setTimeout(() => loading.remove(), 500);
                }
            }, 500);
        });
    </script>
</body>
</html>
