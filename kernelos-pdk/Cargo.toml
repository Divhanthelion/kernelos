[package]
name = "kernelos-pdk"
version = "0.1.0"
edition = "2021"
description = "KernelOS plugin development kit (guest side)"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
