[package]
name = "kernelosv2"
version = "0.2.0"
edition = "2021"
description = "A WebAssembly-based desktop environment"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
base64 = "0.22"
sha2 = "0.10"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "MouseEvent",
    "PointerEvent",
    "KeyboardEvent",
    "InputEvent",
    "Event",
    "EventTarget",
    "Storage",
    "CssStyleDeclaration",
    "DomRect",
    "Node",
    "NodeList",
    "Touch",
    "TouchEvent",
    "TouchList",
    "AudioContext",
    "OscillatorNode",
    "OscillatorType",
    "GainNode",
    "AudioDestinationNode",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "AbortController",
    "AbortSignal",
] }
js-sys = "0.3"
wasm-logger = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-timers = "0.4"
rand = "0.10"
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
rexie = "0.6.2"
