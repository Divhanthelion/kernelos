[package]
name = "doc-viewer-plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "doc_viewer_plugin"

[dependencies]
kernelos-pdk = { path = "../../kernelos-pdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
